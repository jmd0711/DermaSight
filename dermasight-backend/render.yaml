services:
  - type: web
    name: skin-lesion-api
    env: python
    plan: free 
    region: oregon 

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

    autoDeploy: true

    healthCheckPath: /health
    healthCheckTimeout: 30

    disk:
      name: model_storage
      mountPath: /opt/models
      sizeGB: 2

    runtime:
      pythonVersion: 3.10

    # GPU is NOT available on Render free tier — comment kept for reference
    # gpu:
    #   type: nvidia-tesla-t4

workers:
  - type: worker
    name: background-preprocessing
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python worker.py
    autoDeploy: false
