services:
  - type: web
    name: skin-lesion-api
    env: python
    plan: free 
    region: oregon 

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MODEL_PATH
        value: /opt/models/lesion_model.h5
      - key: UPLOAD_FOLDER
        value: /opt/uploads

    autoDeploy: true

    healthCheckPath: /health
    healthCheckTimeout: 30

    disk:
      name: model_storage
      mountPath: /opt/models
      sizeGB: 2

    runtime:
      pythonVersion: 3.10

    # GPU is NOT available on Render free tier — comment kept for reference
    # gpu:
    #   type: nvidia-tesla-t4

workers:
  - type: worker
    name: background-preprocessing
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python worker.py
    autoDeploy: false
